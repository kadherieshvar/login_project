<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>instagram Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #feda75, #d62976, #962fbf, #4f5bd5);
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-container {
            width: 350px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 40px 35px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #262626;
            letter-spacing: -1px;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fafafa;
            font-size: 14px;
            outline: none;
        }

        .input-box:focus {
            border-color: #999;
            background: #fff;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 7px;
            background: linear-gradient(90deg, #d62976, #962fbf);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 0;
            color: #888;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #ddd;
            flex: 1;
        }

        .forgot {
            display: block;
            margin-top: 20px;
            color: #385185;
            text-decoration: none;
            font-size: 13px;
        }

        .signup-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #555;
        }

        .signup-box a {
            color: #d62976;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 400px) {
            .login-container {
                width: 90%;
                padding: 35px 25px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">instagram</div>

        <form method="POST">

            <input
                type="email"
                name="email"
                class="input-box"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                class="input-box"
                placeholder="Password"
                required
            >

            <button type="submit" class="login-btn">
                Log in
            </button>

        </form>

        <div class="divider">
            OR
        </div>

        <a href="#" class="forgot">
            Forgot password?
        </a>

        <div class="signup-box">
            Don't have an account?
            <a href="#">Sign up</a>
        </div>

    </div>

</body>

</html>
